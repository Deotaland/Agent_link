# Version of the agent_link SDK component itself. The *firmware* version reported over BLE
# for OTA is PROJECT_VER, set in the top-level CMakeLists.txt - the two are independent.
version: "0.1.0"
description: >-
  Agent Link: connect embedded devices to the Deotaland Agent platform.
  Capability-based I/O protocol over a pluggable transport (BLE, WiFi and Muse).
  Devices declare capabilities + register a few callbacks; the component handles
  all App/Agent plumbing so new hardware integrates in a handful of lines.
license: "MIT"
dependencies:
  idf:
    version: ">=5.0"
  espressif/esp_audio_codec:
    version: "2.2.1"
    require: no
    rules:
      - if: "target != esp32s31"
  espressif/cjson:
    version: "^1.7.19"
    require: no
    rules:
      - if: "idf_version >=6.0"
  espressif/mqtt:
    version: "^1.0.0"
    require: no
    rules:
      - if: "idf_version >=6.0"
